name: Deploy MedDigtwin Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cdk/**"
      - ".github/workflows/deploy-infra.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Install dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Build CDK
        working-directory: infra/cdk
        run: npm run build

      - name: Bootstrap CDK
        working-directory: infra/cdk
        run: npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

      - name: Synth
        working-directory: infra/cdk
        run: npx cdk synth

      - name: Deploy
        working-directory: infra/cdk
        run: npx cdk deploy --require-approval never

      - name: Verify deployed stack
        run: aws cloudformation describe-stacks --stack-name MedDigtwinStack --query "Stacks[0].StackStatus" --output text
