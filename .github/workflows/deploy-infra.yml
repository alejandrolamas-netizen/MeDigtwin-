name: Deploy MedDigtwin Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - production
        required: true
        default: production
      marketplace_product_code:
        description: AWS Marketplace SaaS Product Code
        required: false
      certificate_arn:
        description: ACM certificate ARN for production HTTPS
        required: false
      domain_name:
        description: Public MedDigtwin domain
        required: false
      frontend_origin:
        description: Comma-separated HTTPS origins allowed to call the API from a browser
        required: false
      anthropic_secret_arn:
        description: Optional AWS Secrets Manager ARN for the Anthropic API key; never enter the key itself
        required: false
      claude_model:
        description: Anthropic model identifier; required with the secret ARN to enable Twin Analyst
        required: false

# Deployment is intentionally manual-only. Protect the production GitHub
# Environment with required reviewers and configure AWS OIDC trust narrowly.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: meddigtwin-api
  ECS_CLUSTER: MedDigtwinStack-MedDigtwinCluster
  ECS_SERVICE: MedDigtwinStack-MedDigtwinApiService

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate AWS role configuration
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN || vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_TO_ASSUME" ]; then
            echo "::error::AWS_GITHUB_ACTIONS_ROLE_ARN is not configured as a GitHub Actions secret or repository variable."
            echo "Configure the IAM role ARN in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN || vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: infra/cdk
        run: npm install

      - name: Build CDK
        working-directory: infra/cdk
        run: npm run build

      - name: Bootstrap CDK
        working-directory: infra/cdk
        run: npx cdk bootstrap aws://$(aws sts get-caller-identity --query Account --output text)/${{ env.AWS_REGION }}

      - name: Synth
        working-directory: infra/cdk
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          MARKETPLACE_PRODUCT_CODE: ${{ inputs.marketplace_product_code }}
          CERTIFICATE_ARN: ${{ inputs.certificate_arn }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
          ANTHROPIC_SECRET_ARN: ${{ inputs.anthropic_secret_arn }}
          CLAUDE_MODEL: ${{ inputs.claude_model }}
        run: |
          CLAUDE_ENABLED=false
          if [ -n "$ANTHROPIC_SECRET_ARN" ] && [ -n "$CLAUDE_MODEL" ]; then CLAUDE_ENABLED=true; fi
          npx cdk synth \
            -c environment="$DEPLOY_ENVIRONMENT" \
            -c marketplaceProductCode="$MARKETPLACE_PRODUCT_CODE" \
            -c certificateArn="$CERTIFICATE_ARN" \
            -c domainName="$DOMAIN_NAME" \
            -c corsOrigins="$FRONTEND_ORIGIN" \
            -c anthropicSecretArn="$ANTHROPIC_SECRET_ARN" \
            -c claudeModel="$CLAUDE_MODEL" \
            -c claudeEnabled="$CLAUDE_ENABLED"

      - name: Deploy
        working-directory: infra/cdk
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
          MARKETPLACE_PRODUCT_CODE: ${{ inputs.marketplace_product_code }}
          CERTIFICATE_ARN: ${{ inputs.certificate_arn }}
          DOMAIN_NAME: ${{ inputs.domain_name }}
          ANTHROPIC_SECRET_ARN: ${{ inputs.anthropic_secret_arn }}
          CLAUDE_MODEL: ${{ inputs.claude_model }}
        run: |
          CLAUDE_ENABLED=false
          if [ -n "$ANTHROPIC_SECRET_ARN" ] && [ -n "$CLAUDE_MODEL" ]; then CLAUDE_ENABLED=true; fi
          npx cdk deploy --require-approval never \
            -c environment="$DEPLOY_ENVIRONMENT" \
            -c marketplaceProductCode="$MARKETPLACE_PRODUCT_CODE" \
            -c certificateArn="$CERTIFICATE_ARN" \
            -c domainName="$DOMAIN_NAME" \
            -c anthropicSecretArn="$ANTHROPIC_SECRET_ARN" \
            -c claudeModel="$CLAUDE_MODEL" \
            -c claudeEnabled="$CLAUDE_ENABLED"

      - name: Verify deployed stack
        run: aws cloudformation describe-stacks --stack-name MedDigtwinStack --query "Stacks[0].StackStatus" --output text

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push initial API image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" ./api
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      - name: Register initial immutable task definition
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition meddigtwin-api \
            --region "$AWS_REGION" \
            --query taskDefinition > /tmp/task-definition.json

          jq --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
             | .containerDefinitions[0].image=$IMAGE' \
            /tmp/task-definition.json > /tmp/task-definition-rendered.json

          aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-definition-rendered.json \
            --region "$AWS_REGION" > /tmp/registered.json

          echo "TASK_DEFINITION=$(jq -r '.taskDefinition.taskDefinitionArn' /tmp/registered.json)" >> "$GITHUB_ENV"

      - name: Activate API service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --desired-count 2 \
            --region "$AWS_REGION"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
