name: MedDigtwin CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "infra/cdk/**"
      - "index.html"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Install test runner
        run: pip install pytest

      - name: Run API tests
        run: PYTHONPATH=. python -m pytest api/tests -q

      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(); scripts=re.findall(r'<script>(.*?)</script>', s, re.S); assert scripts, 'No inline JavaScript found'; Path('/tmp/meddigtwin-inline.js').write_text(scripts[-1])"
          node --check /tmp/meddigtwin-inline.js

      - name: Compile API
        run: python -m compileall -q api

      - name: Build API container
        run: docker build -t meddigtwin-api:ci ./api

  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install infrastructure dependencies
        run: npm install

      - name: Compile CDK TypeScript
        run: npm run build

      - name: Synthesize demo infrastructure template
        run: npx cdk synth -c environment=demo -c claudeEnabled=false
