<style>
:root{color-scheme:dark;--bg:#0a0e16;--bg2:#0d1220;--panel:#111827;--panel2:#141c2e;--line:#22304a;--ink:#e7ecf5;--dim:#93a1bb;--faint:#5c6a86;--blue:#4a90ff;--teal:#2fd6c4;--amber:#f0a83a;--red:#f2566a;--mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans",sans-serif}
*{box-sizing:border-box}body{margin:0;background-color:var(--bg);background-image:linear-gradient(#4a90ff08 1px,transparent 1px),linear-gradient(90deg,#4a90ff08 1px,transparent 1px);background-size:34px 34px;color:var(--ink);font-family:var(--sans)}button,input{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:225px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}.mark{font:600 11px var(--mono);letter-spacing:.14em;color:var(--blue)}.brand h1{font-size:14px;margin:7px 0 3px}.sub{font:10px var(--mono);color:var(--faint)}nav{display:grid;gap:3px}nav button{border:0;background:transparent;color:var(--dim);text-align:left;padding:9px 10px;border-radius:6px;font-size:13px}nav button:hover,nav button.active{background:#4a90ff18;color:#fff}nav button.active{border-left:2px solid var(--blue);padding-left:8px}.n{font:10px var(--mono);color:var(--faint);display:inline-block;width:22px}.state{margin-top:16px;border-top:1px solid var(--line);padding:12px 7px;font:10px/1.9 var(--mono);color:var(--faint)}.good{color:var(--teal)}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{position:sticky;top:0;z-index:4;background:#0a0e16ed;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.status{font:10px var(--mono);color:var(--dim);display:flex;gap:8px;align-items:center}.dot{height:7px;width:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal)}.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:7px 10px;border-radius:5px;font:10px var(--mono)}.btn:hover,.btn.on{border-color:var(--blue);color:#fff}.btn.primary{background:var(--blue);border-color:var(--blue);color:#07101e;font-weight:600}.env,.tag,.chip{font:9px var(--mono);border:1px solid var(--line);border-radius:4px;padding:4px 7px;color:var(--faint)}.env{color:var(--amber);border-color:#f0a83a55}.content{width:100%;max-width:1250px;padding:22px 24px 80px;margin:0 auto}.page{display:none}.page.active{display:block;animation:fade .2s}@keyframes fade{from{opacity:.5;transform:translateY(3px)}to{opacity:1;transform:none}}h2{font-size:21px;margin:8px 0 5px}.subtitle{font-size:13px;line-height:1.6;color:var(--dim);max-width:800px;margin:0 0 17px}.strip{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}.strip b{font:10px var(--mono);color:var(--dim)}.flow{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}.flow>div{padding:12px;background:var(--panel2);border-right:1px solid var(--line)}.flow>div:last-child{border:0}.flow i{font:9px var(--mono);color:var(--blue);display:block;margin-bottom:5px}.flow strong{font-size:12px}.flow small{display:block;color:var(--faint);font-size:10px;margin-top:4px}.banner{padding:12px 14px;border:1px solid #2c5fb8;background:#4a90ff10;border-radius:8px;margin-bottom:15px;font-size:12px;line-height:1.6}.banner b{color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.kpi,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;min-width:0}.label{font:10px var(--mono);color:var(--faint)}.value{font-size:24px;font-weight:600;margin-top:6px}.delta{font:10px var(--mono);margin-top:4px;color:var(--dim)}.panel{margin-bottom:14px}.panel h3{font-size:14px;margin:0 0 4px}.ph{font-size:11px;color:var(--faint);margin:0 0 12px;line-height:1.5}.twin{border:1px solid var(--line);border-radius:8px;overflow:auto;background:var(--bg2)}.twin svg{display:block;width:100%;min-width:720px}.edge{stroke:#2c5fb8;fill:none;stroke-linecap:round}.flowline{stroke-dasharray:5 6;animation:dash 1.1s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}.tn{cursor:pointer}.tn:focus{outline:none}.tlabel{font:10px var(--mono);fill:var(--dim);text-anchor:middle}.tval{font:600 11px var(--mono);text-anchor:middle}.legend{display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding:10px;font:10px var(--mono);color:var(--faint)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.detail{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;color:var(--dim);font-size:12px}.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px;font:10px/1.8 var(--mono)}.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px 22px}.slider label,.control label{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);margin-bottom:6px}.val{font:11px var(--mono);color:var(--blue)}input[type=range]{width:100%;accent-color:var(--blue)}.run{margin-top:16px}.compare{display:grid;grid-template-columns:1fr 1fr}.col{padding:10px}.col:first-child{border-right:1px solid var(--line)}.colhead{font:10px var(--mono);color:var(--faint);margin-bottom:8px}.metric{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}.metric:last-child{border:0}.mv{font:11px var(--mono);text-align:right}.ok{color:var(--teal)}.warn{color:var(--amber)}.crit{color:var(--red)}.decision{background:var(--panel2);border:1px solid #2c5fb8;border-radius:8px;padding:13px;margin-top:12px}.decision p{font-size:12px;line-height:1.6;color:var(--dim);margin:6px 0 0}.scgrid,.ecogrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.scenario,.eco{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:14px}.scenario h3,.eco h3{font-size:13px;margin:0 0 6px}.scenario p,.eco p{font-size:12px;line-height:1.5;color:var(--dim);margin:0 0 10px}.vars{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.vars span{font:9px var(--mono);border:1px solid var(--line);padding:3px 6px;border-radius:4px;color:var(--faint)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;font:9px var(--mono);color:var(--faint);padding:8px;border-bottom:1px solid var(--line)}td{font:10px var(--mono);padding:8px;border-bottom:1px solid var(--line)}.rankrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:12px;margin:8px 0}.rank{font:18px var(--mono);color:var(--faint)}.rankbody{flex:1;min-width:0}.rankbody b{font-size:12px}.rankbody small{display:block;color:var(--faint);font-size:10px;margin-top:4px;line-height:1.5}.arch{display:grid;gap:5px}.layer{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:12px}.layer b{font-size:12px}.items{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.items span{font:9px var(--mono);border:1px solid var(--line);padding:3px 6px;border-radius:4px;color:var(--dim)}.arrow{text-align:center;color:var(--faint)}.timeline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.clock{font:13px var(--mono);color:var(--blue)}.log{font:10px var(--mono);color:var(--faint);margin-top:9px;min-height:14px}.foot{text-align:center;padding:25px 12px;color:var(--faint);font:10px/1.8 var(--mono)}.demobar{position:sticky;bottom:0;background:#0a0e16f5;border-top:1px solid var(--blue2);padding:10px 20px;display:none;align-items:center;justify-content:space-between;gap:10px;z-index:5}.demotxt{font:10px var(--mono);color:var(--dim)}.demotxt b{color:var(--blue)}.presenting .sidebar{display:none}.presenting .content{max-width:1450px}.presenting .topbar{position:relative}@media(max-width:850px){.sidebar{width:190px}.flow{grid-template-columns:1fr}.flow>div{border-right:0;border-bottom:1px solid var(--line)}.flow>div:last-child{border-bottom:0}.kpis{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:580px){.sidebar{display:none}.content{padding:15px 11px 65px}.topbar{padding:10px}.kpis{gap:7px}.kpi{padding:10px}.value{font-size:20px}.sliders,.scgrid,.ecogrid,.compare{grid-template-columns:1fr}.col:first-child{border-right:0;border-bottom:1px solid var(--line)}.detailgrid{grid-template-columns:1fr 1fr}.banner{font-size:11px}.demobar{padding:9px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="app" id="app">
<aside class="sidebar"><div class="brand"><div class="mark">EMERGENTSOFT</div><h1>Gemelo Digital Industrial</h1><div class="sub">PAQUETE VERTICAL · SINTÉTICO</div></div><nav id="nav" aria-label="Navegación principal"></nav><div class="state" id="state"></div></aside>
<main class="main"><header class="topbar"><div class="status"><span class="dot"></span> MOTOR DE SIMULACIÓN · LOCAL</div><div class="buttons"><button class="btn" id="present">⛶ Presentación</button><button class="btn" id="demo">▶ Demo guiada</button></div><span class="env">DATOS SINTÉTICOS · SIN SISTEMAS EXTERNOS</span></header><main class="content" id="content" tabindex="-1"></main>
<div class="demobar" id="demoBar"><div class="demotxt">PASO <b id="demoN">1</b>/<span id="demoTotal">8</span> — <span id="demoDesc"></span></div><div class="buttons"><button class="btn" id="demoPrev">← Anterior</button><button class="btn primary" id="demoNext">Siguiente →</button><button class="btn" id="demoExit">Salir</button></div></div></main></div>
<script>
"use strict";
const VARS=[
 {k:"demand",label:"Demanda de pedidos",min:-20,max:50,u:"%"},
 {k:"staff",label:"Disponibilidad de operarios",min:-30,max:30,u:"%"},
 {k:"icu",label:"Capacidad de mantenimiento",min:-20,max:30,u:"%"},
 {k:"orcap",label:"Capacidad de líneas de producción",min:-20,max:30,u:"%"},
 {k:"lab",label:"Tiempo de control de calidad",min:-30,max:50,u:"%"},
 {k:"ed",label:"Tasa de pedidos urgentes",min:-20,max:50,u:"%"},
 {k:"elective",label:"Volumen de pedidos programados",min:-30,max:30,u:"%"}
];
const BASE=Object.freeze({demand:0,staff:0,icu:0,orcap:0,lab:0,ed:0,elective:0});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const round=(v,n=1)=>Number(v.toFixed(n));
function compute(v){
 const d=v.demand/100,s=v.staff/100,ic=v.icu/100,or=v.orcap/100,lb=v.lab/100,ed=v.ed/100,el=v.elective/100;
 const load=1+d*.85+ed*.35;
 const relief=1-s*.55-ic*.15-or*.10;
 const friction=1+lb*.40;
 const wait=clamp(42*load*relief*friction,15,180);
 const maintenance=clamp(84*(1+d*.5-ic*.75+ed*.3-s*.1),20,100);
 const stock=clamp(78*(1+d*.55-s*.25+ed*.15),20,100);
 const workforce=clamp(91*(1-s*.6+d*.5+ed*.2),20,100);
 const lines=clamp(76*(1+el*.55+d*.15-or*.65),15,100);
 const quality=clamp(68*(1+lb*.8-s*.2+d*.2+ed*.1),15,100);
 const throughput=Math.max(50,Math.round(214*(1+s*.35+or*.25-d*.12-lb*.1)));
 const queue=Math.max(3,Math.round(14*(1+lb*.9-s*.25+d*.15+ed*.1)));
 const arrivals=Math.max(50,Math.round(180*(1+d*.6+ed*.7)));
 const pressureValues=[maintenance,stock,workforce,lines,quality];
 const bottlenecks=pressureValues.filter(x=>x>=88).length+(wait>=55?1:0);
 const pressureScore=round(pressureValues.reduce((a,b)=>a+b,0)/pressureValues.length);
 const pressure=pressureScore>=85?"CRÍTICA":pressureScore>=72?"ALTA":pressureScore>=55?"MODERADA":"BAJA";
 return {wait,maintenance,stock,workforce,lines,quality,throughput,queue,arrivals,bottlenecks,pressureScore,pressure};
}
const baseline=compute(BASE);
const DEFAULT={...BASE,ed:25,demand:15,staff:-10};
const S={vars:{...DEFAULT},current:compute(DEFAULT),active:"Pérdida de proveedor clave",selected:null,simTime:8,playing:false,timer:null,present:false,demo:false,demoStep:0,what:{...BASE,icu:20},history:[]};
S.history.push({name:"Línea base",vars:{...BASE},m:baseline},{name:S.active,vars:{...S.vars},m:S.current});
const N=[
{id:"demand",name:"Demanda de pedidos",x:55,y:150,shape:"dia",u:()=>clamp(50+S.vars.demand*.9,15,100)},
{id:"urgent",name:"Pedidos urgentes",x:55,y:300,shape:"dia",u:()=>clamp(45+S.vars.ed*.8,15,100)},
{id:"staff",name:"Operarios",x:185,y:50,shape:"rect",u:m=>m.workforce},
{id:"equipment",name:"Maquinaria",x:545,y:50,shape:"rect",u:m=>clamp(m.lines*.75,15,100)},
{id:"intake",name:"Recepción",x:185,y:220,shape:"circ",u:m=>clamp(30+m.arrivals/220*70,15,100)},
{id:"planning",name:"Planificación",x:305,y:140,shape:"circ",u:m=>clamp(30+m.arrivals/260*65,15,100)},
{id:"prep",name:"Preparación",x:420,y:220,shape:"circ",u:m=>clamp(30+m.queue/26*70,15,100)},
{id:"inspection",name:"Inspección",x:420,y:340,shape:"circ",u:m=>m.quality*.85},
{id:"quality",name:"Control de calidad",x:305,y:340,shape:"circ",u:m=>m.quality},
{id:"qualitycap",name:"Capacidad de calidad",x:305,y:430,shape:"rect",u:m=>m.quality},
{id:"production",name:"Producción",x:545,y:220,shape:"circ",u:m=>(m.stock*.6+m.lines*.4)},
{id:"maintenance",name:"Mantenimiento",x:690,y:120,shape:"circ",u:m=>m.maintenance},
{id:"stock",name:"Stock de insumos",x:690,y:220,shape:"circ",u:m=>m.stock},
{id:"lines",name:"Líneas de producción",x:690,y:320,shape:"circ",u:m=>m.lines},
{id:"stockcap",name:"Capacidad de stock",x:690,y:430,shape:"rect",u:m=>m.stock},
{id:"dispatch",name:"Despacho",x:825,y:220,shape:"circ",u:m=>clamp(30+m.throughput/280*70,15,100)}
];
const E=[["demand","intake"],["urgent","intake"],["urgent","planning"],["intake","planning"],["planning","prep"],["prep","inspection"],["prep","quality"],["prep","production"],["production","maintenance"],["production","stock"],["production","lines"],["maintenance","dispatch"],["stock","dispatch"],["lines","dispatch"],["staff","intake"],["staff","production"],["staff","maintenance"],["staff","quality"],["staff","stock"],["equipment","prep"],["equipment","lines"],["equipment","inspection"],["qualitycap","quality"],["qualitycap","prep"],["stockcap","stock"],["stockcap","maintenance"],["stockcap","production"]];
const node=id=>N.find(n=>n.id===id);
const statusFor=u=>u>=88?{color:"var(--red)",label:"ALTA"}:u>=72?{color:"var(--amber)",label:"ELEVADA"}:{color:"var(--teal)",label:"NOMINAL"};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function twin(m){let lines="",nodes="";for(const [a,b] of E){const A=node(a),B=node(b),u=(A.u(m)+B.u(m))/2;lines+=`<line class="edge ${u>=60?"flowline":""}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke-width="${u>=85?3:u>=65?2:1.2}" opacity="${clamp(.25+u/140,.25,.95)}"/>`}
 for(const n of N){const u=clamp(n.u(m),0,100),st=statusFor(u),selected=S.selected===n.id,fill=clamp(.12+u/220,.12,.55);let shape=n.shape==="circ"?`<circle cx="${n.x}" cy="${n.y}" r="${u>=88?26:22}"`:n.shape==="dia"?`<rect x="${n.x-16}" y="${n.y-16}" width="32" height="32" rx="5" transform="rotate(45 ${n.x} ${n.y})"`:`<rect x="${n.x-31}" y="${n.y-14}" width="62" height="28" rx="6"`;nodes+=`<g class="tn" tabindex="0" role="button" aria-label="Ver ${esc(n.name)}" data-node="${n.id}">${shape} fill="${st.color}" fill-opacity="${fill}" stroke="${selected?"#fff":st.color}" stroke-width="${selected?2.5:1.4}"/><text class="tval" x="${n.x}" y="${n.y+4}" fill="${st.color}">${Math.round(u)}</text><text class="tlabel" x="${n.x}" y="${n.y+(n.shape==="rect"?32:(u>=88?39:35))}">${esc(n.name)}</text></g>`}
 return `<div class="twin"><svg viewBox="0 0 900 470" role="img" aria-label="Topología de la línea industrial; seleccione un nodo para ver detalles">${lines}${nodes}</svg><div class="legend"><span><i style="background:var(--teal)"></i>Nominal</span><span><i style="background:var(--amber)"></i>Presión elevada</span><span><i style="background:var(--red)"></i>Alta presión</span><span>Grosor = intensidad modelada · seleccionar nodo</span></div></div>`}
function selectedDetail(m){if(!S.selected)return"";const n=node(S.selected);if(!n)return"";const u=clamp(n.u(m),0,100),st=statusFor(u),up=E.filter(e=>e[1]===n.id).map(e=>node(e[0]).name),dn=E.filter(e=>e[0]===n.id).map(e=>node(e[1]).name);return `<div class="detail"><b>${esc(n.name)}</b> — estado operativo simulado<div class="detailgrid"><div>UTILIZACIÓN<br><span style="color:${st.color}">${u.toFixed(0)}%</span></div><div>PRESIÓN<br><span style="color:${st.color}">${st.label}</span></div><div>AGUAS ARRIBA<br>${esc(up.join(", ")||"—")}</div><div>AGUAS ABAJO<br>${esc(dn.join(", ")||"—")}</div></div></div>`}
const V=[["overview","Resumen"],["twin","Gemelo Digital"],["simulation","Simulación"],["whatif","Qué pasa si"],["scenarios","Escenarios"],["bottlenecks","Cuellos de botella"],["architecture","Arquitectura"]];
const nav=document.getElementById("nav");for(const [id,label] of V){const b=document.createElement("button");b.dataset.page=id;b.innerHTML=`<span class="n">${String(nav.children.length+1).padStart(2,"0")}</span>${label}`;b.addEventListener("click",()=>{active=id;render()});nav.appendChild(b)}
let active="overview";
function state(){document.getElementById("state").innerHTML=`Motor: <span class="good">LOCAL</span><br>Vertical: <span class="good">INDUSTRIAL</span><br>Nodos: <span class="good">${N.length}</span><br>Relaciones: <span class="good">${E.length}</span><br>Escenario: <span class="good">${esc(S.active)}</span><br>Hora: <span class="good">${String(S.simTime).padStart(2,"0")}:00</span><br>Datos: <span class="good">SINTÉTICOS</span><br><span>Sin APIs externas</span>`}
function header(title,sub){return `<h2>${title}</h2><p class="subtitle">${sub}</p><div class="strip"><span class="tag">GEMELO DIGITAL INDUSTRIAL</span><b>Escenario: ${esc(S.active)}</b><span class="tag">MODELO DETERMINISTA</span></div>`}
function kpi(label,val,delta){return `<div class="kpi"><div class="label">${label}</div><div class="value">${val}</div><div class="delta">${delta}</div></div>`}
function footer(){return `<div class="foot">SIMULAR ANTES DE OPERAR.<br>EmergentSoft · Infraestructura inteligente · Fuerza de trabajo digital<br>Prototipo sintético; no conectado a sistemas productivos y no ejecuta acciones reales.</div>`}
function timeline(){return `<div class="panel"><h3>Horizonte de simulación</h3><p class="ph">Curva de carga ilustrativa; las métricas se recalculan para la hora seleccionada.</p><div class="timeline"><button class="btn" id="timePlay">${S.playing?"⏸ Pausar":"▶ Reproducir"}</button><button class="btn" id="timeReset">↻ Reiniciar</button><input aria-label="Hora simulada" type="range" min="8" max="24" value="${S.simTime}" id="timeRange"><span class="clock">${String(S.simTime).padStart(2,"0")}:00</span><span class="chip">${timeLabel()}</span></div></div>`}
function day(h){return .55+.9*Math.max(Math.exp(-Math.pow(h-10.5,2)/9),Math.exp(-Math.pow(h-16,2)/11))}
function timeLabel(){const f=day(S.simTime);return f>1.15?"PICO DE DEMANDA":f<.8?"CARGA BAJA":"CARGA NORMAL"}
function metricsAtTime(){const f=day(S.simTime),v={...S.vars,demand:clamp(S.vars.demand+(f-1)*40,-20,50),ed:clamp(S.vars.ed+(f-1)*35,-20,50)};return compute(v)}
function setTime(h){S.simTime=clamp(+h,8,24);S.current=metricsAtTime();render()}
function stopTimer(){if(S.timer!==null){clearInterval(S.timer);S.timer=null}S.playing=false}
function toggleTime(){if(S.playing){stopTimer();render();return}S.playing=true;S.timer=setInterval(()=>{if(S.simTime>=24){stopTimer();render();return}S.simTime++;S.current=metricsAtTime();render();if(S.simTime>=24)stopTimer()},900);render()}
function kpis(m){return `<div class="kpis">${kpi("Pedidos recibidos / día",m.arrivals,"estimación sintética")}${kpi("Presión de stock",m.stock.toFixed(0)+"%","utilización modelada")}${kpi("Uso de mantenimiento",m.maintenance.toFixed(0)+"%","utilización modelada")}${kpi("Espera promedio",m.wait.toFixed(0)+" min","estimación sintética")}</div>`}
function viewOverview(){const m=S.current;return `<span class="tag">PAQUETE VERTICAL · INDUSTRIA</span><h2>Gemelo Digital Industrial en Vivo</h2><p class="subtitle">Modelar dependencias operativas, simular intervenciones e identificar restricciones antes de tomar decisiones sobre una línea de producción.</p>${kpis(m)}<div class="flow"><div><i>01</i><strong>Observar</strong><small>Estado operativo</small></div><div><i>02</i><strong>Modelar</strong><small>Entidades y restricciones</small></div><div><i>03</i><strong>Simular</strong><small>Escenarios sintéticos</small></div><div><i>04</i><strong>Comparar</strong><small>Línea base e intervención</small></div><div><i>05</i><strong>Evaluar</strong><small>Decisión humana</small></div></div><div class="banner"><b>SIMULAR ANTES DE OPERAR.</b> Esta demo usa exclusivamente datos sintéticos y fórmulas ilustrativas. No está conectada a una fábrica, ERP, sensores ni servicio de IA externo.</div><div class="panel"><h3>Topología operativa</h3><p class="ph">Demanda → recepción → planificación → producción → despacho; recursos y capacidades aparecen como nodos relacionados.</p>${twin(m)}</div>`}
function viewTwin(){return header("Gemelo Digital — Topología operativa","Seleccione un nodo para inspeccionar su utilización modelada y sus dependencias.")+`<div class="panel">${twin(S.current)}${selectedDetail(S.current)}</div>${timeline()}`}
function sliders(keys=VARS,source=S.vars){return `<div class="sliders">${keys.map(v=>`<div class="slider"><label for="s-${v.k}">${v.label}<span class="val">${source[v.k]>0?"+":""}${source[v.k]}${v.u}</span></label><input id="s-${v.k}" type="range" min="${v.min}" max="${v.max}" value="${source[v.k]}" data-var="${v.k}"></div>`).join("")}</div>`}
function metric(label,value,base){const diff=value-base,p=base?diff/Math.abs(base)*100:0;return `<div class="metric"><span>${label}</span><span class="mv">${value.toFixed(1)}<span class="${Math.abs(p)<.5?"":diff>0?"crit":"ok"}"> ${Math.abs(p)<.5?"—":(p>0?"+":"")+p.toFixed(0)+"%"}</span></span></div>`}
function raw(label,value,unit=""){return `<div class="metric"><span>${label}</span><span class="mv">${Number(value).toFixed(1)}${unit}</span></div>`}
function classify(b,s){const score=(b.pressureScore-s.pressureScore)+(b.wait-s.wait)/5+(b.bottlenecks-s.bottlenecks)*4;return score>3?"MEJORA":score< -3?"EMPEORA":"MIXTO"}
function insight(s,b){const a=[["Mantenimiento",s.maintenance-b.maintenance,s.maintenance],["Stock de insumos",s.stock-b.stock,s.stock],["Operarios",s.workforce-b.workforce,s.workforce],["Líneas de producción",s.lines-b.lines,s.lines],["Control de calidad",s.quality-b.quality,s.quality]].sort((x,y)=>Math.abs(y[1])-Math.abs(x[1]));const p=a[0],q=a[1];let why=S.vars.demand>0?`La demanda subió ${S.vars.demand}%, aumentando la carga modelada.`:S.vars.staff<0?`La disponibilidad de operarios cayó ${Math.abs(S.vars.staff)}%, restringiendo capacidad.`:S.vars.ed>0?`Los pedidos urgentes subieron ${S.vars.ed}%, aumentando la presión de ingreso.`:"Las variables seleccionadas modifican las restricciones modeladas.";return `<div class="panel"><h3>Análisis de restricciones</h3><p class="ph">Cálculo determinista; no es una respuesta generada por IA.</p><div class="card"><div class="label">RESTRICCIÓN PRIMARIA</div><b>${p[0]} · cambio ${p[1]>=0?"+":""}${p[1].toFixed(1)} puntos</b><div class="label" style="margin-top:12px">INTERPRETACIÓN</div><p class="subtitle" style="margin:4px 0">${why}</p><div class="label">RESTRICCIÓN SECUNDARIA</div><b>${q[0]} · ${q[2].toFixed(0)}%</b><div class="label" style="margin-top:12px">INTERVENCIONES DE EJEMPLO</div><div class="buttons" style="margin-top:8px"><button class="btn" data-intervene="icu">A · Mantenimiento +20%</button><button class="btn" data-intervene="lab">B · Tiempo de calidad −20%</button><button class="btn" data-intervene="elective">C · Programados −20%</button></div></div></div>`}
function results(){const b=baseline,s=S.current,c=classify(b,s),cls=c==="MEJORA"?"ok":c==="EMPEORA"?"crit":"warn";return `<div class="panel"><h3>Impacto operativo</h3><p class="ph">${esc(S.active)} — comparación determinista con la línea base sintética.</p><div class="compare"><div class="col"><div class="colhead">LÍNEA BASE</div>${raw("Espera promedio",b.wait," min")}${raw("Presión de mantenimiento",b.maintenance,"%")}${raw("Presión de stock",b.stock,"%")}${raw("Producción / semana",b.throughput)}${raw("Cola de calidad",b.queue)}${raw("Cuellos de botella",b.bottlenecks)}<div class="metric"><span>Presión general</span><span class="mv">${b.pressure}</span></div></div><div class="col"><div class="colhead">ESCENARIO SIMULADO</div>${metric("Espera promedio",s.wait,b.wait)}${metric("Presión de mantenimiento",s.maintenance,b.maintenance)}${metric("Presión de stock",s.stock,b.stock)}${metric("Producción / semana",s.throughput,b.throughput)}${metric("Cola de calidad",s.queue,b.queue)}${metric("Cuellos de botella",s.bottlenecks,b.bottlenecks)}<div class="metric"><span>Presión general</span><span class="mv">${s.pressure}</span></div></div></div><div class="decision"><b class="${cls}">${c} · resultado modelado</b><p>${c==="MEJORA"?"La intervención mejora el indicador compuesto sintético.":c==="EMPEORA"?"La intervención empeora el indicador compuesto sintético.":"Los efectos son mixtos; inspeccione las métricas individuales."} Esto no demuestra un resultado industrial real ni recomienda ejecutar un cambio físico.</p></div></div>${insight(s,b)}`}
function viewSimulation(){return header("Control de simulación","Ajuste las variables operativas y ejecute un escenario local reproducible.")+`<div class="panel">${sliders()}<div class="buttons run"><button class="btn primary" id="runSim">Ejecutar simulación</button><button class="btn" id="resetSim">Restablecer línea base</button></div><div class="log" id="log" role="status"></div></div><div id="results">${results()}</div>`}
function runSimulation(name){S.current=compute(S.vars);if(name)S.active=name;else if(!S.active)S.active="Escenario personalizado";S.history.push({name:S.active,vars:{...S.vars},m:S.current});if(S.history.length>50)S.history.shift();render()}
function reset(){stopTimer();S.vars={...BASE};S.current=baseline;S.active="Línea base";S.stack=[];S.selected=null;S.simTime=8;render()}
function viewWhatIf(){const p=compute(S.what),m=S.current;return header("Simulación Qué pasa si","Compare una intervención propuesta sin modificar el escenario activo.")+`<div class="scgrid"><div class="card"><h3>Estado actual</h3>${raw("Mantenimiento",m.maintenance,"%")}${raw("Espera",m.wait," min")}${raw("Cuellos de botella",m.bottlenecks)}${raw("Presión general",m.pressureScore)}</div><div class="card"><h3>Intervención propuesta</h3>${sliders(VARS.filter(v=>["demand","staff","icu","lab"].includes(v.k)),S.what)}${raw("Mantenimiento",p.maintenance,"%")}${raw("Espera",p.wait," min")}${raw("Cuellos de botella",p.bottlenecks)}${raw("Presión general",p.pressureScore)}<button class="btn primary" id="adoptWhat">Adoptar como escenario activo</button></div></div><div class="panel"><h3>Topología con intervención propuesta</h3>${twin(p)}</div>`}
const SC=[
["Pico de pedidos","Aumenta la demanda de pedidos.",{...BASE,demand:20,ed:15}],
["Falta de operarios","Cae la disponibilidad de operarios.",{...BASE,staff:-15}],
["Ampliación de mantenimiento","Aumenta la capacidad de mantenimiento.",{...BASE,icu:20}],
["Optimización de calidad","Reduce el tiempo de control de calidad.",{...BASE,lab:-25}],
["Pérdida de proveedor clave","Suben los pedidos urgentes y cae la disponibilidad de operarios.",{...BASE,ed:25,demand:15,staff:-10}]
];
function viewScenarios(){return header("Biblioteca de escenarios","Ejecute un caso sintético, compare resultados y mantenga un historial de esta sesión.")+`<div class="scgrid">${SC.map((s,i)=>`<div class="scenario"><h3>${s[0]}</h3><p>${s[1]}</p><div class="vars">${Object.entries(s[2]).filter(x=>x[1]).map(x=>`<span>${VARS.find(v=>v.k===x[0]).label} ${x[1]>0?"+":""}${x[1]}%</span>`).join("")}</div><button class="btn primary" data-scenario="${i}">Ejecutar escenario</button></div>`).join("")}</div><div class="panel" style="margin-top:14px"><h3>Historial de esta sesión</h3><div class="tablewrap"><table><thead><tr><th>Escenario</th><th>Demanda</th><th>Operarios</th><th>Mantenimiento</th><th>Espera</th><th>Cuellos</th><th>Presión</th></tr></thead><tbody>${S.history.map(h=>`<tr><td>${esc(h.name)}</td><td>${h.vars.demand}%</td><td>${h.vars.staff}%</td><td>${h.vars.icu}%</td><td>${h.m.wait.toFixed(0)} min</td><td>${h.m.bottlenecks}</td><td>${h.m.pressure}</td></tr>`).join("")}</tbody></table></div></div>`}
function viewBottlenecks(){const rows=N.map(n=>({n,u:clamp(n.u(S.current),0,100)})).sort((a,b)=>b.u-a.u).slice(0,8);return header("Análisis de cuellos de botella","Nodos ordenados por utilización sintética, con sus dependencias.")+`<div class="panel">${rows.map((r,i)=>{const st=statusFor(r.u),up=E.filter(e=>e[1]===r.n.id).map(e=>node(e[0]).name),dn=E.filter(e=>e[0]===r.n.id).map(e=>node(e[1]).name);return `<button class="rankrow" style="width:100%;text-align:left;color:inherit" data-jump="${r.n.id}"><span class="rank">${String(i+1).padStart(2,"0")}</span><span class="rankbody"><b>${esc(r.n.name)} · ${r.u.toFixed(0)}%</b><small>Entradas: ${esc(up.join(", ")||"—")}<br>Salidas: ${esc(dn.join(", ")||"—")}</small></span><span class="chip" style="color:${st.color}">${st.label}</span></button>`}).join("")}</div>`}
const L=[["Sistemas operativos",["ERP","Planificación","Stock","Dotación","Control de calidad","Mantenimiento","Maquinaria"]],["Tejido de datos y eventos",["Eventos","Streams","Datos operativos","Históricos"]],["Motor de gemelo digital",["Entidades","Relaciones","Estado","Restricciones"]],["Motor de simulación",["Escenarios","Recursos","Capacidad","Qué pasa si"]],["Inteligencia agéntica futura",["Análisis","Explicaciones","Evaluación","Aprobación humana"]],["Soporte de decisión",["Comparar","Simular","Evaluar","Revisión humana"]]];
function viewArchitecture(){return header("Arquitectura de referencia","Diseño conceptual; las integraciones y servicios enumerados no están activos en esta demo.")+`<div class="panel"><div class="arch">${L.map((x,i)=>`<div class="layer"><b>${String(i+1).padStart(2,"0")} · ${x[0]}</b><div class="items">${x[1].map(t=>`<span>${t}</span>`).join("")}</div></div>${i<L.length-1?'<div class="arrow">↓</div>':""}`).join("")}</div></div><div class="panel"><h3>Integración y gobernanza</h3><div class="ecogrid"><div class="eco"><h3>Integración futura</h3><p>Conectores a ERP, inventario y sensores requerirían APIs, pruebas y permisos separados.</p></div><div class="eco"><h3>Soberanía de datos</h3><p>El despliegue real debe definir residencia, cifrado, retención, acceso y auditoría.</p></div><div class="eco"><h3>Gobernanza</h3><p>Resultados sujetos a revisión humana; no se ejecutan acciones físicas.</p></div><div class="eco"><h3>IA externa</h3><p>NVIDIA NIM, NeMo y otros proveedores son opciones arquitectónicas, no integraciones implementadas aquí.</p></div></div><p class="ph" style="margin-top:12px">Este prototipo es autónomo y utiliza fórmulas ilustrativas. No se conecta a una PyME, no invoca APIs de IA y no demuestra validación industrial.</p></div>`}
const views={overview:viewOverview,twin:viewTwin,simulation:viewSimulation,whatif:viewWhatIf,scenarios:viewScenarios,bottlenecks:viewBottlenecks,architecture:viewArchitecture};
function render(){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===active));state();document.getElementById("content").innerHTML=`<section class="page active">${views[active]()}${footer()}</section>`;bindPage();document.getElementById("content").focus({preventScroll:true})}
function bindPage(){document.querySelectorAll("[data-node]").forEach(g=>{const fn=()=>{S.selected=g.dataset.node;render()};g.addEventListener("click",fn);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}})});
 document.querySelectorAll("[data-var]").forEach(el=>{const update=()=>{const k=el.dataset.var,val=+el.value,target=active==="whatif"?S.what:S.vars;target[k]=val;const label=el.parentElement.querySelector(".val");if(label)label.textContent=(val>0?"+":"")+val+"%";const log=document.getElementById("log");if(log&&active==="simulation")log.textContent="Variables modificadas; ejecute la simulación para actualizar los resultados."};el.addEventListener("input",update);if(active==="whatif")el.addEventListener("change",()=>render())});
 const run=document.getElementById("runSim");if(run)run.addEventListener("click",()=>{S.current=compute(S.vars);S.active="Escenario personalizado";S.history.push({name:S.active,vars:{...S.vars},m:S.current});if(S.history.length>50)S.history.shift();render()});
 const rst=document.getElementById("resetSim");if(rst)rst.addEventListener("click",reset);
 document.querySelectorAll("[data-scenario]").forEach(b=>b.addEventListener("click",()=>{const s=SC[+b.dataset.scenario];S.vars={...s[2]};S.current=compute(S.vars);S.active=s[0];S.history.push({name:S.active,vars:{...S.vars},m:S.current});if(S.history.length>50)S.history.shift();active="simulation";render()}));
 document.querySelectorAll("[data-intervene]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.intervene,change=k==="icu"?20:-20;S.vars[k]=clamp(S.vars[k]+change,VARS.find(v=>v.k===k).min,VARS.find(v=>v.k===k).max);S.current=compute(S.vars);S.active+=" + intervención";S.history.push({name:S.active,vars:{...S.vars},m:S.current});active="simulation";render()}));
 document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{S.selected=b.dataset.jump;active="twin";render()}));
 const adopt=document.getElementById("adoptWhat");if(adopt)adopt.addEventListener("click",()=>{for(const k of ["demand","staff","icu","lab"])S.vars[k]=S.what[k];S.current=compute(S.vars);S.active="Intervención Qué pasa si";S.history.push({name:S.active,vars:{...S.vars},m:S.current});active="simulation";render()});
 const tr=document.getElementById("timeRange");if(tr){tr.addEventListener("input",()=>{S.simTime=+tr.value;S.current=metricsAtTime();const clock=document.querySelector(".clock");if(clock)clock.textContent=String(S.simTime).padStart(2,"0")+":00"});tr.addEventListener("change",()=>render())}
 const tp=document.getElementById("timePlay");if(tp)tp.addEventListener("click",toggleTime);const treset=document.getElementById("timeReset");if(treset)treset.addEventListener("click",()=>{stopTimer();S.simTime=8;S.current=metricsAtTime();render()});
}
document.getElementById("present").addEventListener("click",()=>{S.present=!S.present;document.getElementById("app").classList.toggle("presenting",S.present);document.getElementById("present").classList.toggle("on",S.present)});
const DEMO=[
{v:"overview",d:"Línea base sintética: observar la planta modelada.",a:()=>{S.vars={...BASE};S.current=baseline;S.active="Línea base";S.selected=null;}},
{v:"simulation",d:"Estrés: más pedidos urgentes y menos operarios.",a:()=>{S.vars={...BASE,ed:25,demand:15,staff:-10};S.current=compute(S.vars);S.active="Pérdida de proveedor clave";}},
{v:"bottlenecks",d:"Identificar nodos con mayor utilización modelada.",a:()=>{}},
{v:"simulation",d:"Comparar el escenario con la línea base.",a:()=>{}},
{v:"simulation",d:"Probar capacidad de mantenimiento +20%.",a:()=>{S.vars.icu=20;S.current=compute(S.vars);S.active="Proveedor clave + mantenimiento";}},
{v:"whatif",d:"Explorar una alternativa sin modificar el escenario actual.",a:()=>{S.what={...BASE,icu:20};}},
{v:"architecture",d:"Revisar la arquitectura de referencia y los límites de integración.",a:()=>{}},
{v:"overview",d:"Cierre: prototipo sintético, no conectado a producción.",a:()=>{}}
];
function demoStep(){const x=DEMO[S.demoStep];x.a();active=x.v;render();document.getElementById("demoN").textContent=S.demoStep+1;document.getElementById("demoDesc").textContent=x.d}
function setDemo(on){S.demo=on;document.getElementById("demo").classList.toggle("on",on);document.getElementById("demoBar").style.display=on?"flex":"none";if(on){S.demoStep=0;document.getElementById("demoTotal").textContent=DEMO.length;demoStep()}else render()}
document.getElementById("demo").addEventListener("click",()=>setDemo(!S.demo));document.getElementById("demoExit").addEventListener("click",()=>setDemo(false));document.getElementById("demoNext").addEventListener("click",()=>{S.demoStep=(S.demoStep+1)%DEMO.length;demoStep()});document.getElementById("demoPrev").addEventListener("click",()=>{S.demoStep=(S.demoStep+DEMO.length-1)%DEMO.length;demoStep()});
window.addEventListener("beforeunload",stopTimer);
render();
</script>
</body>
</html>
